<!DOCTYPE html>
<html>
    <head>
        <title>
            {{ customer.user.first_name }} {{ customer.user.last_name }}'s Favorite Sellers
        </title>
    </head>
    <body>
        <ul>
            {% for seller in sellers %}
                <li>{{ seller.store.seller.user.first_name }} {{ seller.store.seller.user.last_name }}</li>
            {% endfor %}
        </ul>
    </body>
</html>
