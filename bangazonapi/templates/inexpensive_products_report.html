<!DOCTYPE html>
<html>
    <head>
        <title>Inexpensive Products Report</title>
    </head>
    <body>
        <table>
            <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Price</th>
            </tr>
        </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{product.id}}</td>
            <td>{{product.name}}</td>
            <td>{{product.price}}</td>
        </tr>
        {% endfor %}
    </tbody>    
    </table>
    </body>
    </html>
